nxt_components:
  - type: motor
    name: right_tread_joint
    power_to_nm: 0.01
    power_max: 127
    brick: NXT1
    port: PORT_A
    desired_frequency: 20.0
  - type: motor
    name: left_tread_joint
    power_to_nm: 0.01
    power_max: 127
    brick: NXT1
    port: PORT_C
    desired_frequency: 20.0
  - type: motor
    name: torso_joint
    power_to_nm: 0.01
    power_max: 100
    brick: NXT1
    port: PORT_B
    desired_frequency: 1.0
  - type: touch
    name: right_bumper
    frame_id: right_bumper_link
    brick: NXT1
    port: PORT_1
    desired_frequency: 2.0
  - type: touch
    name: left_bumper
    frame_id: left_bumper_link
    brick: NXT1
    port: PORT_2
    desired_frequency: 2.0
  - type: touch
    name: back_bumper
    frame_id: back_bumper_link
    brick: NXT1
    port: PORT_3
    desired_frequency: 2.0
  - type: ultrasonic
    frame_id: ultrasonic_sensor_link
    name: ultrasonic_sensor
    brick: NXT1
    port: PORT_4
    spread_angle: 0.2
    min_range: 0.07
    max_range: 2.54
    radiation_type: 0
    field_of_view: 0.5235987756
    desired_frequency: 3.0
  - type: motor
    name: head_joint
    power_to_nm: 0.01
    power_max: 75
    brick: NXT2
    port: PORT_A
    desired_frequency: 2.0
  - type: motor
    name: arms_joint
    power_to_nm: 0.01
    power_max: 50
    brick: NXT2
    port: PORT_C
    desired_frequency: 1.0
  - type: motor
    name: laser_joint
    power_to_nm: 0.01
    power_max: 50
    brick: NXT2
    port: PORT_B
    desired_frequency: 1.0
  - type: color
    name: color_sensor
    frame_id: color_sensor_link
    brick: NXT2
    port: PORT_2
    desired_frequency: 1.0
  - type: intensity
    name: intensity_sensor
    frame_id: intensity_sensor_link
    brick: NXT2
    port: PORT_2
    desired_frequency: 1.0
  - type: light
    name: line_following_sensor
    frame_id: line_following_sensor_link
    brick: NXT2
    port: PORT_3
    desired_frequency: 3.0
  - type: rfid
    name: rfid_sensor
    frame_id: rfid_sensor_link
    sensor_type: RFID
    sensor_manufacturer: Codatex
    firmware_version: V1.0
    sensor_serial: 08010204
    brick: NXT2
    port: PORT_4
    desired_frequency: 1.0
  - type: sound
    name: sound_sensor
    frame_id: sound_sensor_link
    brick: NXT2
    port: PORT_1
    desired_frequency: 1.0